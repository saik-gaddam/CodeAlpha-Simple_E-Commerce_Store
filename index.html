<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CodeAlpha E-Commerce</h1>
        <div id="cart-status">Cart: <span id="cart-count">0</span> items</div>
    </header>

    <main id="product-list">
        <!-- Products will be injected here by JS -->
    </main>

    <section id="cart-modal" class="hidden">
        <h2>Your Cart</h2>
        <ul id="cart-items"></ul>
        <button onclick="processOrder()">Checkout</button>
        <button onclick="toggleCart()">Close</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
