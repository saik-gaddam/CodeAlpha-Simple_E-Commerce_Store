<!DOCTYPE html>
<html>
<head>
    <title>CodeAlpha E-Commerce</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        header { background: #333; color: #fff; padding: 1rem; display: flex; justify-content: space-between; }
        header a { color: #fff; text-decoration: none; margin-left: 15px; }
        .container { padding: 20px; max-width: 1000px; margin: auto; background: #fff; min-height: 80vh; }
        .btn { background: #007BFF; color: white; padding: 8px 12px; border: none; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h2><a href="{% url 'product_list' %}">CodeAlpha Store</a></h2>
        <div>
            <a href="{% url 'cart_view' %}">Cart</a>
            {% if user.is_authenticated %}
                <a href="{% url 'admin:index' %}">Profile</a>
            {% else %}
                <a href="/admin/login/">Login</a>
            {% endif %}
        </div>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
